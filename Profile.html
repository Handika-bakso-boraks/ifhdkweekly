<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile of Res Shoot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Modern Navbar */
        .navbar {
            display: flex;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .navbar a:hover, .navbar a.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Main Content Grid/Flex */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Logo Container to prevent stacking awkwardly */
        .logo-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .logo { 
            width: 180px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: translateY(-5px);
        }

        /* Typography */
        .brand-title {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .brand-subtitle {
            font-size: 20px;
            color: #a5c7f7;
            font-weight: 400;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .description {
            font-size: 18px;
            line-height: 1.8;
            color: #e2e8f0;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* Responsive Breakpoints */
        @media (max-width: 600px) {
            .brand-title { font-size: 36px; }
            .brand-subtitle { font-size: 16px; }
            .logo { width: 140px; }
            .navbar a { padding: 8px 12px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Ganti tabel lama dengan Semantic HTML Nav -->
    <nav class="navbar">
        <a href="profile.html" class="active">Profile</a>
        <a href="Home.html">Home</a>
        <a href="Comishion.html">Commission</a>
        <a href="Galeri.html">Gallery</a>
    </nav>

    <main class="main-content">
        <!-- Kontainer khusus agar kedua logo sejajar ke samping -->
        <div class="logo-container">
            <img src="assets/Logo/wmm.png" alt="Res Shoot Logo" class="logo">
            <img src="assets/Logo/watermark 2.png" alt="RESSER Logo" class="logo">  
        </div>
        
        <h1 class="brand-title">Res Shoot</h1>
        <h2 class="brand-subtitle">Resser</h2>
        
        <p class="description">
            Res Shoot comes from <strong>RESCUE</strong>, dedicated to rescuing people's moments. 
            By capturing snapshots that may never happen again, Res Shoot freezes time 
            and turns fleeting instances into memories for eternity.
        </p>
    </main>

</body>
</html>
